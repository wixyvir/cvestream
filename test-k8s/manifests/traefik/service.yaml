# Stands for the Scaleway LoadBalancer Service of production: ClusterIP here,
# reached with `kubectl port-forward`.
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
