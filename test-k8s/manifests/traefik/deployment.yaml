# The public instance of wixyvir/services (k8s/infra/traefik/deployment.yaml)
# with these differences: plain HTTP on :8000 (no websecure, no ACME, no OVH
# credentials), non-root (no port below 1024 to bind), no Ingress provider, and
# the namespace filter of wixyvir/services#1 step 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.6.15
          args:
            - "--entryPoints.web.address=:8000"
            - "--entryPoints.traefik.address=:8080"
            - "--providers.kubernetescrd=true"
            - "--providers.kubernetescrd.namespaces=traefik,apps"
            - "--providers.kubernetescrd.allowCrossNamespace=true"
            - "--ping=true"
            - "--accesslog=true"
            - "--accesslog.format=json"
            - "--log.level=INFO"
          ports:
            - name: web
              containerPort: 8000
            - name: traefik
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
            initialDelaySeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
