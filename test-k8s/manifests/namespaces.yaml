# The namespaces of wixyvir/services (k8s/infra/namespaces.yaml), plus the
# `private` namespace proposed in wixyvir/services#1.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    # cvestream meets the "restricted" Pod Security Standard: enforce it.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# VPN-only IngressRoutes. Nothing runs here.
apiVersion: v1
kind: Namespace
metadata:
  name: private
  labels:
    pod-security.kubernetes.io/enforce: restricted
