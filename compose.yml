# Dev loop: `docker compose watch`.
#
# By default the stack serves the placeholder tokens of endpoints.example.yaml:
#   http://127.0.0.1:8080/feeds/REPLACE-ME-with-secrets-token-urlsafe-32-team-php.xml
# Point CVESTREAM_ENDPOINTS_FILE at your own file to serve real tokens.
#
# The `valkey` service (the configuration store, docs/config-contract.md) is
# always started but only used with CVESTREAM_CONFIG_PROVIDER=valkey:
#   CVESTREAM_CONFIG_PROVIDER=valkey docker compose watch
# The store starts empty: the daemon waits for it (valkey.startup_timeout) and
# exits with code 3, or with code 2 while it is unseeded. Seed it as
# cvestream-admin (a seeding example is in docs/config-contract.md):
#   docker compose exec valkey valkey-cli --user cvestream-admin \
#     --pass "$(cat deploy/valkey/dev-secrets/cvestream-admin.password)"
# The passwords in deploy/valkey/dev-secrets/ are public, for development only.
# Valkey is on an internal network: no host port, no access from outside.
#
# The `valkey-ui` service (story 3.4) is a Valkey administration UI (Redis
# Insight, SSPL-licensed, used unmodified): http://127.0.0.1:5540, already
# connected to `valkey` as `cvestream-ui` with the public dev password from a
# compose secret. It has no authentication of its own: loopback only, never
# expose it. Its writes skip validation and the revision bump: prefer the CLI,
# and run `INCR cvestream:v1:revision` in the UI's CLI tab after a UI edit.
# If 127.0.0.1:5540 is already bound, `docker compose up` fails to start it.
services:
  app:
    build:
      context: .
      target: dev
    command: ["watchfiles", "cvestream run", "src"]
    environment:
      CVESTREAM_ENDPOINTS_FILE: ${CVESTREAM_ENDPOINTS_FILE:-endpoints.example.yaml}
      CVESTREAM_LOG__FORMAT: console
      CVESTREAM_CONFIG_PROVIDER: ${CVESTREAM_CONFIG_PROVIDER:-yaml}
      CVESTREAM_VALKEY__URL: valkey://cvestream-daemon@valkey:6379/0
      # A secret file, never an inline password.
      CVESTREAM_VALKEY__PASSWORD_FILE: /run/secrets/valkey-daemon-password
    networks: [default, config]
    secrets: [valkey-daemon-password]
    # Loopback only: the private listener (9090) is never published.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./endpoints.example.yaml
          target: /app/endpoints.example.yaml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml
  valkey:
    image: valkey/valkey:9.1.3
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    volumes:
      - ./deploy/valkey:/usr/local/etc/valkey:ro
      - valkey-data:/data
    # Internal network: no host port, no way out.
    networks: [config]
  # Valkey administration UI (story 3.4): http://127.0.0.1:5540, already
  # connected as cvestream-ui. No authentication of its own: loopback only.
  # Redis Insight is SSPL-licensed: used unmodified, never redistributed.
  valkey-ui:
    image: redis/redisinsight:3.8.0
    depends_on: [valkey]
    environment:
      # Every value is quoted: the code tests === 'true' / !== 'false'.
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"   # skips the EULA screen, analytics off
      RI_DATABASE_MANAGEMENT: "false"          # the connection list is fixed
      RI_STATICS_AUTO_UPDATE: "false"
      RI_FILES_LOGGER: "false"                 # logs on stdout only
      # host, user and password of the cvestream connection, from a secret file
      RI_PRE_SETUP_DATABASES_PATH: /run/secrets/valkey-ui-databases
    secrets: [valkey-ui-databases]
    # `config` reaches Valkey; it is internal and cannot publish a port, hence `default`.
    networks: [default, config]
    ports:
      - "127.0.0.1:5540:5540"
    # Hardening is not optional: read-only root, tmpfs for the writable paths.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /data:uid=1000,gid=1000
      - /tmp:uid=1000,gid=1000

networks:
  config:
    internal: true

secrets:
  valkey-daemon-password:
    file: ./deploy/valkey/dev-secrets/cvestream-daemon.password
  valkey-ui-databases:
    file: ./deploy/valkey/dev-secrets/cvestream-ui.redisinsight.json

volumes:
  valkey-data:
