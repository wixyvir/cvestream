[project]
name = "cvestream"
version = "0.1.0"
description = "Filtered vulnerability RSS feeds from EUVD and CISA KEV"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1,<1",
    "packaging>=26.3",
    "pydantic>=2.14.3",
    "pydantic-settings[yaml]>=2.16.2",
    "sqlalchemy>=2.1.8",
    "starlette>=1.10.0",
    "structlog>=26.1.0",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
cvestream = "cvestream.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "import-linter>=2.16",
    "pytest>=9.2.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "ty>=0.0.92",
    "watchfiles>=1.3.0",
]

[tool.ruff]
src = ["src", "tests"]
# BMad tooling and planning artifacts are not project code
extend-exclude = ["_bmad", "_bmad-output", ".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DTZ", "BLE", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# fake tokens are the point of the redaction tests
"tests/unit/test_log.py" = ["S105", "S106"]
"tests/unit/config/test_models.py" = ["S105", "S106"]
"tests/unit/config/test_provider.py" = ["S105", "S106"]
"tests/unit/config/test_yaml_provider.py" = ["S105", "S106"]
"tests/unit/cli/test_config.py" = ["S105", "S106"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --allow-unix-socket is required: the asyncio event loop creates a Unix
# socketpair, which pytest-socket would otherwise block. TCP and DNS stay blocked.
addopts = ["--disable-socket", "--allow-unix-socket", "-m", "not live", "--strict-markers"]
markers = [
    "live: hits the real network; deselected by default, run by source-drift.yml",
    "valkey: needs a Valkey server",
]

[tool.importlinter]
root_package = "cvestream"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers (architecture.md: Component boundaries)"
type = "layers"
layers = [
    "cvestream.cli",
    "cvestream.app",
    "cvestream.pipeline",
    "cvestream.config | cvestream.sources | cvestream.state",
    "cvestream.http : cvestream.settings : cvestream.log : cvestream.clock : cvestream.errors",
    "cvestream.domain",
]

[[tool.importlinter.contracts]]
name = "domain is pure: stdlib and packaging only"
type = "forbidden"
source_modules = ["cvestream.domain"]
forbidden_modules = [
    # every project module outside domain
    "cvestream.cli",
    "cvestream.app",
    "cvestream.pipeline",
    "cvestream.config",
    "cvestream.sources",
    "cvestream.state",
    "cvestream.http",
    "cvestream.settings",
    "cvestream.log",
    "cvestream.clock",
    "cvestream.errors",
    # every third-party package of the stack except packaging
    "pydantic",
    "pydantic_settings",
    "structlog",
    "typer",
    "yaml",
    "httpx",
    "sqlalchemy",
    "alembic",
    "valkey",
    "starlette",
    "uvicorn",
    "feedparser",
    "anyio",
]
# The AST allow-list test (tests/unit/domain/test_purity.py) is the positive
# counterpart: import-linter can only deny a list, never allow one.

# Library ownership, one forbidden contract per library family.
# Ownership means "imports directly": a higher layer may import the owner
# (pipeline -> state -> sqlalchemy), hence allow_indirect_imports = true.

[[tool.importlinter.contracts]]
name = "httpx only in sources and http"
type = "forbidden"
source_modules = [
    "cvestream.domain",
    "cvestream.config",
    "cvestream.state",
    "cvestream.pipeline",
    "cvestream.app",
    "cvestream.cli",
    "cvestream.settings",
    "cvestream.log",
    "cvestream.clock",
    "cvestream.errors",
]
forbidden_modules = ["httpx"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "sqlalchemy and alembic only in state"
type = "forbidden"
source_modules = [
    "cvestream.http",
    "cvestream.domain",
    "cvestream.config",
    "cvestream.sources",
    "cvestream.pipeline",
    "cvestream.app",
    "cvestream.cli",
    "cvestream.settings",
    "cvestream.log",
    "cvestream.clock",
    "cvestream.errors",
]
forbidden_modules = ["sqlalchemy", "alembic"]
allow_indirect_imports = true

# valkey: only cvestream.config.valkey_provider. That module does not exist
# yet, so for now only cvestream.config as a whole may import it; story 3.1
# tightens this to cvestream.config.valkey_provider.
[[tool.importlinter.contracts]]
name = "valkey only in config"
type = "forbidden"
source_modules = [
    "cvestream.http",
    "cvestream.domain",
    "cvestream.sources",
    "cvestream.state",
    "cvestream.pipeline",
    "cvestream.app",
    "cvestream.cli",
    "cvestream.settings",
    "cvestream.log",
    "cvestream.clock",
    "cvestream.errors",
]
forbidden_modules = ["valkey"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "starlette and uvicorn only in app"
type = "forbidden"
source_modules = [
    "cvestream.http",
    "cvestream.domain",
    "cvestream.config",
    "cvestream.sources",
    "cvestream.state",
    "cvestream.pipeline",
    "cvestream.cli",
    "cvestream.settings",
    "cvestream.log",
    "cvestream.clock",
    "cvestream.errors",
]
forbidden_modules = ["starlette", "uvicorn"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "typer only in cli"
type = "forbidden"
source_modules = [
    "cvestream.http",
    "cvestream.domain",
    "cvestream.config",
    "cvestream.sources",
    "cvestream.state",
    "cvestream.pipeline",
    "cvestream.app",
    "cvestream.settings",
    "cvestream.log",
    "cvestream.clock",
    "cvestream.errors",
]
forbidden_modules = ["typer"]
allow_indirect_imports = true
