[project]
name = "cvestream"
version = "0.1.0"
description = "Filtered vulnerability RSS feeds from EUVD and CISA KEV"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings[yaml]>=2.16.1",
    "structlog>=26.1.0",
    "typer>=0.27.3",
]

[project.scripts]
cvestream = "cvestream.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.2",
    "ty>=0.0.92",
    "watchfiles>=1.3.0",
]
