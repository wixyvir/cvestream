# cvestream settings. Copy to settings.yaml (gitignored) and adjust.
#
# Lookup: the file named by CVESTREAM_SETTINGS_FILE, else ./settings.yaml.
# A missing default file is fine; a missing explicit file, invalid YAML or a
# top level that is not a mapping is an error.
#
# Every key can also be set through the environment: prefix CVESTREAM_, with
# a double underscore for nesting (log.level -> CVESTREAM_LOG__LEVEL).
# Environment variables beat this file; values are merged key by key.
# An unknown top-level CVESTREAM_* variable (for example the typo
# CVESTREAM_LOG_LEVEL) is ignored for now, while unknown nested keys
# (CVESTREAM_LOG__LEVL) and unknown keys in this file are rejected. A startup
# warning for ignored variables is planned.
#
# Durations are ISO 8601 in environment variables (PT30M = 30 minutes; a bare
# number such as 1800 is rejected there). In this file you may write either
# ISO 8601 (PT30M) or a number of seconds (1800).
#
# Secrets (state.url for now) are read from CVESTREAM_<NAME>_FILE variables pointing
# to a file, nested names included (CVESTREAM_<SECTION>__<NAME>_FILE); setting
# both CVESTREAM_<NAME> and CVESTREAM_<NAME>_FILE is an error.

# Where the endpoint configuration (teams, products, rules, feed tokens) comes
# from. Only "yaml" exists for now.
# Env: CVESTREAM_CONFIG_PROVIDER
config_provider: yaml

# Path of the endpoints file when config_provider is yaml (see
# endpoints.example.yaml), relative to the working directory. A plain path, not
# a secret: CVESTREAM_ENDPOINTS_FILE holds the path itself.
# Env: CVESTREAM_ENDPOINTS_FILE
endpoints_file: endpoints.yaml

# Directory for runtime data. The state database lives in it unless state.url
# says otherwise: <data_dir>/cvestream.db (created by `cvestream db migrate`).
# The image sets it to /data.
# Env: CVESTREAM_DATA_DIR
data_dir: data

# SQLAlchemy URL of the state database (state.url). Default: the SQLite file
# <data_dir>/cvestream.db (a relative data_dir is relative to the working
# directory; an absolute one gives sqlite:////data/cvestream.db). SQLite needs
# block storage (never NFS, SMB or CIFS). A PostgreSQL URL carries a password,
# so this is a secret: prefer the file form.
# Env: CVESTREAM_STATE__URL, or CVESTREAM_STATE__URL_FILE=/path/to/file
# state:
#   url: sqlite:///data/cvestream.db

http:
  # The daemon has two listeners. Publish only the public one (8080): the
  # private one serves /healthz, /readyz and /status and is never public.
  # Defaults bind every interface because the container's network namespace is
  # the boundary; on a bare host, use 127.0.0.1 for the private listener.
  public:
    # Feeds: GET and HEAD /feeds/<token>.xml. Env: CVESTREAM_HTTP__PUBLIC__HOST
    host: 0.0.0.0
    # Env: CVESTREAM_HTTP__PUBLIC__PORT
    port: 8080
  private:
    # Health and status. Env: CVESTREAM_HTTP__PRIVATE__HOST
    host: 0.0.0.0
    # Env: CVESTREAM_HTTP__PRIVATE__PORT. `cvestream healthcheck` probes 9090:
    # when you change this port, pass `--port` to the healthcheck too (and to
    # the image HEALTHCHECK, if you keep it).
    port: 9090

log:
  # Minimum level. One of: debug, info, warning, error.
  # Env: CVESTREAM_LOG__LEVEL
  level: info
  # Output format. One of: json (one object per line), console (human readable).
  # Env: CVESTREAM_LOG__FORMAT
  format: json

sources:
  # Polling settings per source: euvd, cisa_kev, cert_eu.
  euvd:
    # Poll this source. Env: CVESTREAM_SOURCES__EUVD__ENABLED
    enabled: true
    # Polling interval: greater than 0 and at most 60 minutes (NFR-1).
    # Env: CVESTREAM_SOURCES__EUVD__INTERVAL
    interval: PT15M
    # Pause between two EUVD result pages, from 0 to 60 seconds. EUVD answers
    # HTTP 403 when paged faster than about 40 to 60 requests a minute.
    # Env: CVESTREAM_SOURCES__EUVD__PAGE_PAUSE
    page_pause: PT1.5S
  cisa_kev:
    # Env: CVESTREAM_SOURCES__CISA_KEV__ENABLED
    enabled: true
    # Env: CVESTREAM_SOURCES__CISA_KEV__INTERVAL
    interval: PT15M
  cert_eu:
    # CERT-EU security advisories (RSS, then the JSON of each new advisory).
    # Env: CVESTREAM_SOURCES__CERT_EU__ENABLED
    enabled: true
    # Env: CVESTREAM_SOURCES__CERT_EU__INTERVAL
    interval: PT15M
