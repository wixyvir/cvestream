# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Epic Status Transitions:
#   - backlog → in-progress: Automatically when first story is created (via create-story)
#   - in-progress → done: Manually when all stories reach 'done' status
#
# Story Status:
#   - backlog: Story only exists in epic file
#   - ready-for-dev: Story file created in stories folder
#   - in-progress: Developer actively working on implementation
#   - review: Ready for code review (via Dev's code-review workflow)
#   - done: Story completed
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - done: Retrospective has been completed
#
# WORKFLOW NOTES:
# ===============
# - Epic transitions to 'in-progress' automatically when first story is created
# - Stories can be worked in parallel if team capacity allows
# - Developer typically creates next story after previous one is 'done' to incorporate learnings
# - Dev moves story to 'review', then runs code-review (fresh context, different LLM recommended)
#
# PARALLEL WAVES:
# ===============
# Rule: epics are never worked in parallel. An epic starts only when the
# previous epic is 'done'. Parallel work happens only between stories of the
# same epic.
# Stories in the same wave can be developed in parallel (one branch + PR each).
# A wave starts when every story of the previous wave is 'done'.
#   Epic 1
#     Wave 1: 1-1
#     Wave 2: 1-2                   (every later story builds on domain/model.py)
#     Wave 3: 1-3 | 1-4
#     Wave 4: 1-5
#     Wave 5: 1-6
#   Epic 2 (starts when epic-1 is done)
#     Wave 6: 2-1 | 2-2
#   Epic 3 (starts when epic-2 is done)
#     Wave 7: 3-1 | 3-3
#     Wave 8: 3-2
#
# Dependencies (story: needs):
#   1-2: 1-1 · 1-3: 1-2 · 1-4: 1-2 · 1-5: 1-2, 1-3, 1-4 · 1-6: 1-5
#   2-1: 1-4, 1-5 · 2-2: 1-4
#   3-1: 1-3, 1-6 · 3-2: 1-3, 3-1 · 3-3: 1-6
#
# Caveats when running a wave in parallel:
#   - Expect conflicts on shared files. Resolve uv.lock by rebasing and
#     re-running `uv lock`, never by merging it by hand.
#       Wave 3 (1-3 | 1-4): pyproject.toml, uv.lock, settings.py, cli/main.py.
#       Wave 6 (2-1 | 2-2): uv.lock, settings.py, sources/registry.py,
#         settings.example.yaml, docs/sources.md.
#       Wave 7 (3-1 | 3-3): ci.yml (Valkey service vs Kustomize check),
#         docs/operations.md, README.md. The example Valkey StatefulSet in 3-3
#         must mount deploy/valkey/valkey.conf and users.acl from 3-1: rebase
#         3-3 on 3-1 before finishing it.
#   - Story files written for a parallel wave carry fewer learnings from the
#     previous stories than the default "create next after done" flow.

