# EXAMPLE ONLY: placeholders, no real value. Replace the password (or remove
# this file from kustomization.yaml and create the Secret out of band, e.g.
# `kubectl -n cvestream create secret generic cvestream-valkey
# --from-file=password=<file>`). Never commit a real password. It must be the
