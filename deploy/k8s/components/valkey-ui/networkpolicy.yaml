# Nothing in the cluster reaches the UI: no ingress rule. `kubectl
# port-forward` enters the pod directly, so NetworkPolicy does not filter it.
# Egress is Valkey 6379 and DNS only; the daily GitHub feature-flag fetch of
# Redis Insight is blocked on purpose (the UI still works, it logs a warning).
# The DNS rule assumes kube-dns in kube-system (k8s-app: kube-dns); with
# NodeLocal DNSCache or another DNS deployment, adjust the peer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvestream-valkey-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey-ui
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    # DNS: kube-dns in kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Valkey.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - port: 6379
          protocol: TCP
