# TEMPLATE ONLY, not a resource of the component (kustomization.yaml does not
# list it, so applying the component never overwrites your Secret). Create the
# Secret from it with your own password, e.g.
# `kubectl -n cvestream create secret generic cvestream-valkey-ui
# --from-file=databases.json=<file>`. Never commit a real password. The
# password must be the one whose SHA-256 is on the cvestream-ui line of the
# users.acl you deploy, and the host must be your Valkey Service
# (cvestream-valkey in the example overlay).
apiVersion: v1
kind: Secret
metadata:
  name: cvestream-valkey-ui
type: Opaque
stringData:
  databases.json: '[{"id": "cvestream", "name": "cvestream", "host": "cvestream-valkey", "port": 6379, "username": "cvestream-ui", "password": "REPLACE-ME-valkey-password-of-cvestream-ui"}]'
