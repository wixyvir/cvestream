# TEST ONLY (CI builds it, `.github/workflows/ci.yml`): the example overlay
# with the opt-in valkey-ui component enabled, so the component cannot rot.
# Never deploy this overlay as is: secret.example.yaml holds placeholders.
# The namespace and labels are repeated here because the component is listed
# by this overlay: transformations of the example overlay do not reach it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cvestream
resources:
  - ../../../deploy/k8s/overlays/example
components:
  - ../../../deploy/k8s/components/valkey-ui
labels:
  - pairs:
      app.kubernetes.io/part-of: cvestream
    includeSelectors: false
