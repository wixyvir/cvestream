name: source-drift

# Runs the `live` contract tests against the real source APIs every night and
# on demand (NFR-5). On failure it opens one issue labelled `source-drift`, or
# comments on the one already open; it never closes it.
#
# Tests are selected by marker, not by file: a new adapter's `live` test runs
# here without editing this file. Scheduled and dispatched runs use the
# workflow file of the default branch (main), so this file only starts running
# once it is merged there.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

# One run at a time, so two runs cannot both open an issue.
concurrency:
  group: source-drift
  cancel-in-progress: false

defaults:
  run:
    # bash -eo pipefail: `pytest | tee` must fail when pytest fails. A step
    # without `shell:` runs `bash -e`, without pipefail.
    shell: bash

jobs:
  live:
    name: live contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      issues: write # create the label, open or comment on the issue
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked
      - name: Live contract tests
        # Shorter than the job timeout: a hung API fails this step, and the
        # report step below still runs (a job-level timeout cancels the job
        # and `failure()` is then false).
        timeout-minutes: 15
        run: uv run pytest -m live tests/contract -v -rfE 2>&1 | tee pytest.log
      - name: Open or update the source-drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "A live contract test failed: a source API may have changed, or the source was unreachable."
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Commit tested: \`${GITHUB_SHA}\`"
            echo
            if [ -f pytest.log ] && grep -qE '^(FAILED|ERROR) ' pytest.log; then
              echo "Failing tests:"
              echo
              echo '```'
              grep -E '^(FAILED|ERROR) ' pytest.log
              echo '```'
            else
              echo "No test result: the job failed before pytest produced one (checkout, install, or no live test collected). See the run log."
            fi
            echo
            echo "Triage: see \`docs/operations.md\`, section Source drift. :factory:"
          } > body.md

          gh label create source-drift \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description "A live contract test failed: a source API may have changed" \
            --force

          issue=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label source-drift \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Source drift: live contract tests failing" \
              --label source-drift \
              --body-file body.md
          fi
