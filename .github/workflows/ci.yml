name: ci

on:
  # No branches: filter: the epic is delivered as stacked PRs, whose base
  # is a story branch, not main.
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job id and name "ci" is the only required status check on main: the
  # Python gates, then the runtime image build (no push) and a smoke test.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run lint-imports
      # A `services:` container starts before checkout and could not mount the
      # repo's deploy/valkey/ (users.acl, valkey.conf), hence a step. The valkey
      # tests fail, they do not skip, when VALKEY_TEST_ADDRESS is missing on CI.
      - name: Start Valkey
        run: |
          docker run -d --name valkey -p 127.0.0.1:6379:6379 \
            -v "$PWD/deploy/valkey:/usr/local/etc/valkey:ro" \
            valkey/valkey:9.1.3 valkey-server /usr/local/etc/valkey/valkey.conf
          for _ in $(seq 30); do
            docker exec valkey valkey-cli --no-auth-warning --user cvestream-daemon \
              --pass "$(cat deploy/valkey/dev-secrets/cvestream-daemon.password)" PING \
              | grep -q PONG && exit 0
            sleep 1
          done
          docker logs valkey
          exit 1
      - run: uv run pytest
        env:
          VALKEY_TEST_ADDRESS: 127.0.0.1:6379
      - run: uv run cvestream config schema --check
      - run: uv run cvestream config validate endpoints.example.yaml
      # kubectl and its built-in kustomize are preinstalled on the runner.
      - name: Kustomize builds
        run: |
          kubectl version --client
          kubectl kustomize deploy/k8s/base >/dev/null
          kubectl kustomize deploy/k8s/overlays/example >/dev/null
          kubectl kustomize tests/k8s/example-with-valkey-ui >/dev/null
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: cvestream:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm cvestream:ci --help

  # Push to main: build amd64 and arm64 and push edge and sha-<short> to GHCR.
  publish:
    name: publish
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/wixyvir/cvestream
          tags: |
            type=edge,branch=main
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
